structure           __RESID__.psf
coordinates         __RESID___psfgen.pdb

paraTypeCharmm      on
parameters          __RESID__.prm

exclude             scaled1-4
1-4scaling          0.5
cutoff              100.0
switching           off
pairlistdist        102.0

# OPLS-AA uses a geometric-mean combining rule for sigma (as well as
# epsilon, which NAMD always combines geometrically) -- without this NAMD
# falls back to CHARMM's arithmetic-mean sigma combining rule, silently
# giving the wrong LJ energy for an OPLS-AA force field. Confirmed against
# the user's own 2017 NAMD-vs-OpenMM test config, which sets the same flag
# for the same reason.
vdwGeometricSigma   yes

temperature         0

outputName          __RESID___sp
outputEnergies      1
binaryOutput        no

timestep            1.0
numsteps            0
run 0
